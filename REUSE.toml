version = 1

# Later annotations take precedence over earlier ones, so the general rule comes first.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 network-topology-diagrams contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["icons/router.svg", "icons/switch.svg", "icons/firewall.svg", "icons/server.svg", "icons/rack.svg"]
precedence = "override"
SPDX-FileCopyrightText = "Red Hat, Inc. and the networking-icons contributors (modified: recoloured)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["icons/printer.svg", "icons/laptop.svg", "icons/phone.svg", "icons/lock.svg", "icons/building.svg", "icons/users.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2020-2026 Pawel Kuna (Tabler Icons); modified: recoloured"
SPDX-License-Identifier = "MIT"
