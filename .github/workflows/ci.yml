name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    env:
      # Hosted Ubuntu runners restrict unprivileged user namespaces, which Chromium's sandbox needs.
      MMDC_NO_SANDBOX: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - name: Build examples (SVG)
        run: python build.py examples/ --outdir out
      - name: Build examples (PNG)
        run: python build.py examples/ --outdir out -f png -s 2
      - name: Check outputs
        run: python scripts/check.py out
      - name: Error handling (bad icon must fail cleanly)
        shell: python
        run: |
          import pathlib, subprocess, sys
          pathlib.Path("bad.mmd").write_text('flowchart TB\n    A@{ img: "icon:nope", label: "x" }\n', encoding="utf-8")
          r = subprocess.run([sys.executable, "build.py", "bad.mmd"], capture_output=True, text=True)
          assert r.returncode == 1 and "unknown icon" in r.stderr and "Traceback" not in r.stderr, r
      - uses: actions/upload-artifact@v4
        with:
          name: diagrams-${{ matrix.os }}-py${{ matrix.python }}
          path: out/

  typst:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
      - run: typst compile examples/example.typ example.pdf

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
